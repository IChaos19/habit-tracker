<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker v3.1.2 Fixed</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .user-info { font-size: 12px; color: #666; }
        .btn-logout { padding: 8px 16px; background: #ff6b6b; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .auth-screen { display: none; }
        .app-screen { display: none; }
        .habits { margin-top: 20px; }
        .habit-item { background: #f9f9f9; padding: 10px; margin: 10px 0; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        button { padding: 8px 16px; background: #667eea; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #764ba2; }
        button.secondary { background: #f5f5f5; color: #333; }
        button.secondary:hover { background: #e8e8e8; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 30px; border-radius: 8px; min-width: 300px; }
        .modal-content h2 { margin-top: 0; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .error { color: #ff6b6b; font-size: 12px; margin: 10px 0; }
        .empty-state { text-align: center; padding: 20px; color: #999; }
        .btn-add { width: 100%; }
        .debug-log { background: #f0f0f0; padding: 10px; margin: 10px 0; border-radius: 4px; font-size: 11px; font-family: monospace; max-height: 200px; overflow-y: auto; }
    </style>
</head>
<body>
    <div id="authScreen" class="auth-screen">
        <div class="container">
            <h1>🎯 Habit Tracker</h1>
            <div id="authError" class="error"></div>
            <div id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="your@email.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="••••••••">
                </div>
                <button onclick="login()">Sign In</button>
                <button class="secondary" onclick="toggleRegister()">Create Account</button>
                <button class="secondary" onclick="guestMode()">Guest Mode</button>
            </div>
            <div id="registerForm" style="display: none;">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="registerEmail" placeholder="your@email.com">
                </div>
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="registerName" placeholder="Your Name">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="registerPassword" placeholder="••••••••">
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="registerConfirm" placeholder="••••••••">
                </div>
                <button onclick="register()">Create Account</button>
                <button class="secondary" onclick="toggleRegister()">Back</button>
            </div>
        </div>
    </div>

    <div id="appScreen" class="app-screen">
        <div class="container">
            <div class="header">
                <h1>🎯 Habit Tracker</h1>
                <div>
                    <div class="user-info" id="userEmail"></div>
                    <button class="btn-logout" onclick="logout()">Logout</button>
                </div>
            </div>

            <button class="btn-add" onclick="addHabitUI()">Add New Habit</button>
            <div class="habits" id="habitsList">No habits</div>

            <div class="debug-log" id="debugLog" style="display: none;">Debug Log</div>
        </div>
    </div>

    <div id="logModal" class="modal">
        <div class="modal-content">
            <h2>Log Habit</h2>
            <p id="habitName"></p>
            <input type="number" id="minutes" placeholder="Minutes" value="30" min="1">
            <button onclick="logHabit()">Log</button>
            <button class="secondary" onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = 'https://kpvifxpxatosmaumldry.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtwdmlmeHB4YXRvc21hdW1sZHJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0NDcyODEsImV4cCI6MjEwNTAyMzI4MX0.LCrNpv1dR10KRO7WBh-nfhkdp-nO0cYaAUeiKXpjTWQ';

        let sbClient = null;
        let currentUser = null;
        let habits = [];
        let isGuest = false;
        let selectedHabitId = null;

        function log(msg) {
            console.log(msg);
            const debugEl = document.getElementById('debugLog');
            debugEl.textContent += msg + '\n';
            debugEl.style.display = 'block';
        }

        function initSupabase() {
            if (window.supabase && !sbClient) {
                sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                log('✓ Supabase initialized');
            }
            return sbClient;
        }

        function showError(msg) {
            const el = document.getElementById('authError');
            el.textContent = msg;
            el.style.display = 'block';
            log('ERROR: ' + msg);
            setTimeout(() => { el.style.display = 'none'; }, 5000);
        }

        async function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            if (!email || !password) { showError('Fill all fields'); return; }
            try {
                const sb = initSupabase();
                if (!sb) { showError('Supabase unavailable'); return; }
                log('Attempting login...');
                const { data, error } = await sb.auth.signInWithPassword({ email, password });
                if (error) { showError(error.message); return; }
                currentUser = data.user;
                log('✓ Login successful: ' + email);
                document.getElementById('loginEmail').value = '';
                document.getElementById('loginPassword').value = '';
                await loadHabits();
                showApp();
            } catch (err) {
                showError('Login failed: ' + err.message);
            }
        }

        async function register() {
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const confirm = document.getElementById('registerConfirm').value;
            const name = document.getElementById('registerName').value;
            if (!email || !password || !confirm || !name) { showError('Fill all fields'); return; }
            if (password !== confirm) { showError('Passwords do not match'); return; }
            try {
                const sb = initSupabase();
                log('Attempting registration...');
                const { data, error } = await sb.auth.signUp({ email, password, options: { data: { display_name: name } } });
                if (error) { showError(error.message); return; }
                currentUser = data.user;
                log('✓ Registration successful');
                toggleRegister();
                showApp();
            } catch (err) {
                showError('Registration failed: ' + err.message);
            }
        }

        function guestMode() {
            isGuest = true;
            currentUser = { id: 'guest', email: 'guest@local' };
            habits = JSON.parse(localStorage.getItem('habits_guest') || '[]');
            log('✓ Guest mode');
            showApp();
        }

        async function logout() {
            try {
                if (!isGuest) {
                    const sb = initSupabase();
                    if (sb) await sb.auth.signOut();
                }
                currentUser = null;
                habits = [];
                isGuest = false;
                showAuth();
            } catch (err) {
                currentUser = null;
                showAuth();
            }
        }

        async function loadHabits() {
            if (isGuest) {
                habits = JSON.parse(localStorage.getItem('habits_guest') || '[]');
                return;
            }
            try {
                const sb = initSupabase();
                if (!sb || !currentUser) return;
                log('Loading habits from Supabase...');
                const { data, error } = await sb.from('habits').select('*').eq('user_id', currentUser.id);
                if (error) throw error;
                habits = (data || []).map(h => ({
                    id: h.id,
                    name: h.name,
                    streak: h.streak || 0,
                    lastLoggedDate: h.last_logged_date,
                    totalPoints: h.total_points || 0,
                    isDeleted: h.is_deleted || false
                }));
                log('✓ Loaded ' + habits.length + ' habits');
            } catch (err) {
                log('ERROR loading: ' + err.message);
            }
        }

        async function saveHabits() {
            if (isGuest) {
                localStorage.setItem('habits_guest', JSON.stringify(habits));
                return;
            }
            try {
                const sb = initSupabase();
                if (!sb || !currentUser) return;
                for (let h of habits) {
                    const dbRecord = {
                        name: h.name,
                        streak: h.streak || 0,
                        last_logged_date: h.lastLoggedDate,
                        total_points: h.totalPoints || 0,
                        is_deleted: h.isDeleted || false
                    };
                    if (!h.id || h.id > Date.now() - 86400000) {
                        const { data, error } = await sb.from('habits').insert([{ user_id: currentUser.id, ...dbRecord }]).select();
                        if (data && data[0]) h.id = data[0].id;
                    } else {
                        await sb.from('habits').update(dbRecord).eq('id', h.id).eq('user_id', currentUser.id);
                    }
                }
                log('✓ Habits saved');
            } catch (err) {
                log('ERROR saving: ' + err.message);
            }
        }

        function addHabitUI() {
            const name = prompt('Habit name:');
            if (name && name.trim()) {
                habits.push({ id: Date.now(), name: name.trim(), streak: 0, lastLoggedDate: null, totalPoints: 0, isDeleted: false });
                log('Added habit: ' + name);
                saveHabits();
                renderHabits();
            }
        }

        function renderHabits() {
            log('Rendering ' + habits.length + ' habits');
            const list = document.getElementById('habitsList');
            const active = habits.filter(h => !h.isDeleted);
            if (active.length === 0) {
                list.innerHTML = '<div class="empty-state">No habits</div>';
                return;
            }
            const html = active.map(h => {
                log('Habit: id=' + h.id + ' name=' + h.name + ' points=' + h.totalPoints);
                return '<div class="habit-item"><div><strong>' + h.name + '</strong><br><small>Streak: ' + h.streak + ' days | Points: ' + h.totalPoints + '</small></div><button type="button" onclick="openLogModal(\'' + h.id + '\')">Log</button></div>';
            }).join('');
            list.innerHTML = html;
        }

        function openLogModal(habitId) {
            log('openLogModal called with id: ' + habitId);
            const h = habits.find(x => x.id === habitId);
            if (!h) { log('Habit not found!'); return; }
            selectedHabitId = habitId;
            document.getElementById('habitName').textContent = 'Log: ' + h.name;
            document.getElementById('minutes').value = '30';
            document.getElementById('logModal').classList.add('active');
            log('Modal opened for: ' + h.name);
        }

        function closeModal() {
            document.getElementById('logModal').classList.remove('active');
            selectedHabitId = null;
        }

        function logHabit() {
            log('logHabit called');
            const mins = parseInt(document.getElementById('minutes').value);
            if (!mins || mins < 1) { alert('Enter valid minutes'); return; }
            const h = habits.find(x => x.id === selectedHabitId);
            if (!h) { log('ERROR: habit not found'); return; }
            h.totalPoints += Math.floor(mins / 15);
            h.lastLoggedDate = new Date().toISOString().split('T')[0];
            h.streak = Math.max(1, h.streak);
            log('Logged ' + mins + ' mins for: ' + h.name);
            saveHabits();
            renderHabits();
            closeModal();
            alert('Logged ' + mins + ' minutes!');
        }

        function toggleRegister() {
            document.getElementById('loginForm').style.display = document.getElementById('loginForm').style.display === 'none' ? 'block' : 'none';
            document.getElementById('registerForm').style.display = document.getElementById('registerForm').style.display === 'none' ? 'block' : 'none';
        }

        function showAuth() {
            document.getElementById('authScreen').style.display = 'block';
            document.getElementById('appScreen').style.display = 'none';
        }

        function showApp() {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('appScreen').style.display = 'block';
            document.getElementById('userEmail').textContent = currentUser.email || 'Guest';
            renderHabits();
        }

        document.addEventListener('DOMContentLoaded', async function() {
            log('Page loaded');
            try {
                const sb = initSupabase();
                if (sb) {
                    const { data: { user } } = await sb.auth.getUser();
                    if (user) {
                        currentUser = user;
                        await loadHabits();
                        showApp();
                        return;
                    }
                }
            } catch (err) {
                log('Init error: ' + err.message);
            }
            showAuth();
        });
    </script>
</body>
</html>
