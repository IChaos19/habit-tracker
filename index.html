<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker v3.0.10</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        .habits { margin-top: 20px; }
        .habit-item { background: #f9f9f9; padding: 10px; margin: 10px 0; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        button { padding: 8px 16px; background: #667eea; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #764ba2; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 30px; border-radius: 8px; min-width: 300px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Habit Tracker v3.0.10</h1>
        <button onclick="addHabitUI()">Add Habit</button>
        <div class="habits" id="habitsList"></div>
    </div>

    <div class="modal" id="logModal">
        <div class="modal-content">
            <h2>Log Habit</h2>
            <p id="habitName"></p>
            <input type="number" id="minutes" placeholder="Minutes" value="30">
            <button onclick="logHabit()">Log</button>
            <button onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <script>
        let habits = [
            { id: 1, name: 'TV', points: 0 },
            { id: 2, name: 'Gaming', points: 0 },
            { id: 3, name: 'Running', points: 0 }
        ];
        let selectedHabitId = null;

        function render() {
            const list = document.getElementById('habitsList');
            list.innerHTML = habits.map(h => `
                <div class="habit-item">
                    <div>
                        <strong>${h.name}</strong>
                        <br>
                        <small>Points: ${h.points}</small>
                    </div>
                    <button onclick="openLogModal(${h.id})">Log</button>
                </div>
            `).join('');
        }

        function openLogModal(habitId) {
            selectedHabitId = habitId;
            const habit = habits.find(h => h.id === habitId);
            document.getElementById('habitName').textContent = `Log: ${habit.name}`;
            document.getElementById('minutes').value = '30';
            document.getElementById('logModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('logModal').classList.remove('active');
            selectedHabitId = null;
        }

        function logHabit() {
            const minutes = parseInt(document.getElementById('minutes').value);
            if (minutes && selectedHabitId) {
                const habit = habits.find(h => h.id === selectedHabitId);
                if (habit) {
                    habit.points += Math.floor(minutes / 15);
                    render();
                    closeModal();
                    alert('Logged: ' + minutes + ' minutes!');
                }
            }
        }

        function addHabitUI() {
            const name = prompt('Habit name:');
            if (name) {
                habits.push({ id: Date.now(), name: name, points: 0 });
                render();
            }
        }

        render();
    </script>
</body>
</html>
