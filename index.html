<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 900px; background: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); overflow: hidden; }
        .auth-container { padding: 60px 40px; text-align: center; }
        .auth-container h1 { color: #333; margin-bottom: 10px; font-size: 32px; }
        .auth-container p { color: #666; margin-bottom: 40px; font-size: 14px; }
        .form-group { margin-bottom: 16px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; color: #333; font-weight: 500; }
        .form-group input { width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; }
        .form-group input:focus { outline: none; border-color: #667eea; }
        .btn { padding: 12px 32px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin: 8px 4px; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; width: 100%; }
        .btn-secondary { background: #f5f5f5; color: #333; width: 100%; margin-top: 12px; }
        .error-message { background: #fee; color: #c33; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; display: none; }
        .app-container { display: none; height: 100vh; overflow-y: auto; background: #f8f9fa; }
        .header { background: white; padding: 20px 40px; border-bottom: 1px solid #e0e0e0; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 24px; color: #333; }
        .user-section { display: flex; align-items: center; gap: 16px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; color: white; font-weight: 600; }
        .btn-logout { background: #fee; color: #c33; padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }
        .content { padding: 40px; max-width: 1200px; margin: 0 auto; }
        .section { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05); margin-bottom: 30px; }
        .section-title { font-size: 18px; font-weight: 600; color: #333; margin-bottom: 20px; }
        .habits-list { display: flex; flex-direction: column; gap: 12px; }
        .habit-item { background: #f8f9fa; padding: 16px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
        .habit-info { flex: 1; }
        .habit-name { font-weight: 600; color: #333; font-size: 14px; }
        .habit-stats { font-size: 12px; color: #999; margin-top: 6px; }
        .habit-actions { display: flex; gap: 8px; }
        .btn-small { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }
        .btn-log { background: #e8f5e9; color: #2e7d32; }
        .btn-delete { background: #fee; color: #c33; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 40px; border-radius: 16px; max-width: 400px; text-align: center; }
        .modal-content h2 { font-size: 24px; color: #333; margin-bottom: 20px; }
        .time-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 16px 0; }
        .time-btn { padding: 10px; border: 2px solid #e0e0e0; background: white; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .time-btn.active { background: #667eea; color: white; border-color: #667eea; }
        .modal-input { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; margin: 16px 0; }
        .modal-actions { margin-top: 24px; display: flex; gap: 12px; }
        .modal-actions button { flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .toast { position: fixed; bottom: 20px; right: 20px; background: #333; color: white; padding: 16px 24px; border-radius: 8px; z-index: 2000; }
        .toast.success { background: #2e7d32; }
        .toast.error { background: #c33; }
    </style>
</head>
<body>
    <div id="authScreen" class="container">
        <div class="auth-container">
            <h1>🎯 Habit Tracker</h1>
            <p>Build better habits, one day at a time</p>
            <div id="errorMessage" class="error-message"></div>
            <div id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="your@email.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="••••••••">
                </div>
                <button class="btn btn-primary" onclick="login()">Sign In</button>
                <button class="btn btn-secondary" onclick="showRegister()">Create Account</button>
                <button class="btn btn-secondary" onclick="guestMode()">Continue as Guest</button>
            </div>
            <div id="registerForm" style="display: none;">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="registerEmail" placeholder="your@email.com">
                </div>
                <div class="form-group">
                    <label>Display Name</label>
                    <input type="text" id="registerName" placeholder="Your Name">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="registerPassword" placeholder="••••••••">
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="registerConfirm" placeholder="••••••••">
                </div>
                <button class="btn btn-primary" onclick="register()">Create Account</button>
                <button class="btn btn-secondary" onclick="showLogin()">Back to Sign In</button>
            </div>
        </div>
    </div>

    <div id="appScreen" class="app-container">
        <div class="header">
            <h1>🎯 Habit Tracker</h1>
            <div class="user-section">
                <div>
                    <div style="font-weight: 600; color: #333; font-size: 14px;" id="userName">User</div>
                    <div style="font-size: 12px; color: #999;" id="userEmail">guest@local</div>
                </div>
                <div class="avatar" id="userAvatar">U</div>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </div>
        <div class="content">
            <div class="section">
                <div class="section-title">📋 Active Habits</div>
                <div class="habits-list" id="habitsList">
                    <p style="color: #999;">No habits yet</p>
                </div>
            </div>
        </div>
    </div>

    <div id="logHabitModal" class="modal">
        <div class="modal-content">
            <h2>Log Habit</h2>
            <p id="logHabitName" style="color: #667eea; font-weight: 600; margin-bottom: 20px;"></p>
            <label style="display: block; margin-bottom: 8px; font-weight: 600; color: #333;">How many minutes?</label>
            <div class="time-buttons">
                <button class="time-btn" onclick="selectTime(15)">15 min</button>
                <button class="time-btn" onclick="selectTime(30)">30 min</button>
                <button class="time-btn" onclick="selectTime(45)">45 min</button>
                <button class="time-btn" onclick="selectTime(60)">60 min</button>
            </div>
            <input type="number" id="customTime" class="modal-input" placeholder="or enter custom minutes" min="1" oninput="updatePointsPreview()">
            <p id="pointsPreview" style="font-size: 13px; color: #667eea; font-weight: 600;"></p>
            <div class="modal-actions">
                <button style="background: #f0f0f0; color: #333;" onclick="closeLogModal()">Cancel</button>
                <button style="background: #667eea; color: white;" onclick="confirmLogHabit()">Log</button>
            </div>
        </div>
    </div>

    <script async src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://kpvifxpxatosmaumldry.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtwdmlmeHB4YXRvc21hdW1sZHJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0NDcyODEsImV4cCI6MjEwNTAyMzI4MX0.LCrNpv1dR10KRO7WBh-nfhkdp-nO0cYaAUeiKXpjTWQ';
        let sbClient = null;
        let currentUser = null;
        let habits = [];
        let isGuest = false;
        let logModalHabitId = null;
        let selectedTime = null;

        function initSupabase() {
            if (window.supabase && !sbClient) {
                sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            }
            return sbClient;
        }

        async function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            if (!email || !password) {
                showError('Please fill in all fields');
                return;
            }
            try {
                const sb = initSupabase();
                if (!sb) { showError('Supabase not available'); return; }
                const { data, error } = await sb.auth.signInWithPassword({ email, password });
                if (error) { showError(error.message); return; }
                currentUser = data.user;
                document.getElementById('userName').textContent = email.split('@')[0];
                document.getElementById('userEmail').textContent = email;
                document.getElementById('userAvatar').textContent = email[0].toUpperCase();
                await loadHabits();
                showApp();
                showToast('Welcome back! 🎉', 'success');
            } catch (err) {
                showError('Login failed: ' + err.message);
            }
        }

        async function register() {
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const confirm = document.getElementById('registerConfirm').value;
            const name = document.getElementById('registerName').value;
            if (!email || !password || !confirm || !name) { showError('Please fill in all fields'); return; }
            if (password !== confirm) { showError('Passwords do not match'); return; }
            if (password.length < 6) { showError('Password must be at least 6 characters'); return; }
            try {
                const sb = initSupabase();
                if (!sb) { showError('Supabase not available'); return; }
                const { data, error } = await sb.auth.signUp({ email, password, options: { data: { display_name: name } } });
                if (error) { showError(error.message); return; }
                currentUser = data.user;
                document.getElementById('userName').textContent = name;
                document.getElementById('userEmail').textContent = email;
                document.getElementById('userAvatar').textContent = name[0].toUpperCase();
                showApp();
                showToast('Account created! 🎉', 'success');
            } catch (err) {
                showError('Registration failed: ' + err.message);
            }
        }

        function guestMode() {
            isGuest = true;
            currentUser = { id: 'guest' };
            document.getElementById('userName').textContent = 'Guest';
            document.getElementById('userEmail').textContent = 'Local storage only';
            document.getElementById('userAvatar').textContent = 'G';
            const stored = localStorage.getItem('habits_guest');
            habits = stored ? JSON.parse(stored) : [];
            showApp();
            showToast('Guest mode 👤', 'success');
        }

        async function logout() {
            try {
                if (!isGuest) { const sb = initSupabase(); if (sb) await sb.auth.signOut(); }
                currentUser = null;
                habits = [];
                isGuest = false;
                showAuth();
                showToast('Logged out', 'success');
            } catch (err) {
                currentUser = null; showAuth();
            }
        }

        async function loadHabits() {
            if (isGuest) {
                const stored = localStorage.getItem('habits_guest');
                habits = stored ? JSON.parse(stored) : [];
                return;
            }
            try {
                const sb = initSupabase();
                if (!sb || !currentUser) return;
                const { data, error } = await sb.from('habits').select('*').eq('user_id', currentUser.id);
                if (error) throw error;
                habits = data || [];
            } catch (err) {
                console.error('Load error:', err);
            }
        }

        async function saveHabits() {
            if (isGuest) {
                localStorage.setItem('habits_guest', JSON.stringify(habits));
                return;
            }
            try {
                const sb = initSupabase();
                if (!sb || !currentUser) return;
                for (let habit of habits) {
                    if (!habit.id || habit.id > Date.now() - 86400000) {
                        const { data, error } = await sb.from('habits').insert([{
                            user_id: currentUser.id, name: habit.name, streak: habit.streak,
                            last_logged_date: habit.lastLoggedDate, total_points: habit.totalPoints,
                            is_deleted: habit.isDeleted, is_completed: habit.isCompleted, completed_at: habit.completedAt
                        }]).select();
                        if (data && data[0]) habit.id = data[0].id;
                    } else {
                        await sb.from('habits').update({
                            name: habit.name, streak: habit.streak, last_logged_date: habit.lastLoggedDate,
                            total_points: habit.totalPoints, is_deleted: habit.isDeleted, is_completed: habit.isCompleted,
                            completed_at: habit.completedAt
                        }).eq('id', habit.id).eq('user_id', currentUser.id);
                    }
                }
            } catch (err) {
                console.error('Save error:', err);
            }
        }

        async function addHabit() {
            const input = document.getElementById('habitInput');
            if (!input) return;
            const name = input.value.trim();
            if (!name) { showError('Enter a habit name'); return; }
            const newHabit = { id: Date.now(), name, streak: 0, lastLoggedDate: null, totalPoints: 0, timeSpentToday: 0, isDeleted: false, isCompleted: false, completedAt: null };
            habits.push(newHabit);
            await saveHabits();
            input.value = '';
            renderHabits();
            showToast('Habit added! 🎉', 'success');
        }

        function renderHabits() {
            const list = document.getElementById('habitsList');
            const activeHabits = habits.filter(h => !h.isDeleted && !h.isCompleted);
            if (activeHabits.length === 0) {
                list.innerHTML = '<p style="color: #999;">No habits yet. Add one!</p>';
                return;
            }
            list.innerHTML = activeHabits.map(habit => `
                <div class="habit-item">
                    <div class="habit-info">
                        <div class="habit-name">${habit.name}</div>
                        <div class="habit-stats">🔥 Streak: ${habit.streak || 0} days | ⭐ Points: ${habit.totalPoints || 0}</div>
                    </div>
                    <div class="habit-actions">
                        <button class="btn-small btn-log" onclick="openLogModal(${habit.id})">Log Habit</button>
                        <button class="btn-small btn-delete" onclick="deleteHabit(${habit.id})">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        function openLogModal(habitId) {
            const habit = habits.find(h => h.id === habitId);
            if (!habit) return;
            logModalHabitId = habitId;
            selectedTime = null;
            document.getElementById('logHabitName').textContent = habit.name;
            document.getElementById('customTime').value = '';
            document.querySelectorAll('.time-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('logHabitModal').style.display = 'flex';
        }

        function selectTime(minutes) {
            selectedTime = minutes;
            document.querySelectorAll('.time-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('customTime').value = '';
            updatePointsPreview();
        }

        function updatePointsPreview() {
            const customTime = parseInt(document.getElementById('customTime').value);
            if (customTime && !isNaN(customTime)) {
                selectedTime = null;
                document.querySelectorAll('.time-btn').forEach(btn => btn.classList.remove('active'));
            }
            const minutes = customTime || selectedTime;
            const preview = document.getElementById('pointsPreview');
            if (!minutes) { preview.textContent = ''; return; }
            const points = Math.floor(minutes / 15);
            preview.textContent = `${minutes} min = ${points} point${points !== 1 ? 's' : ''}`;
        }

        function confirmLogHabit() {
            const customTime = parseInt(document.getElementById('customTime').value);
            const minutes = customTime || selectedTime;
            if (!minutes) { showError('Select or enter time'); return; }
            if (minutes < 1) { showError('Time must be at least 1 minute'); return; }
            logHabit(logModalHabitId, minutes);
            closeLogModal();
        }

        function closeLogModal() {
            document.getElementById('logHabitModal').style.display = 'none';
            logModalHabitId = null;
            selectedTime = null;
        }

        async function logHabit(habitId, minutes) {
            const habit = habits.find(h => h.id === habitId);
            if (!habit) return;
            const today = new Date().toISOString().split('T')[0];
            const lastLog = habit.lastLoggedDate;
            const yesterday = new Date(new Date().setDate(new Date().getDate() - 1)).toISOString().split('T')[0];
            if (lastLog === today) {
                const oldPoints = Math.floor(habit.timeSpentToday / 15);
                habit.timeSpentToday += minutes;
                const newPoints = Math.floor(habit.timeSpentToday / 15);
                const pointsEarned = newPoints - oldPoints;
                habit.totalPoints += pointsEarned;
                showToast(`Added ${minutes} mins = ${pointsEarned} new point${pointsEarned !== 1 ? 's' : ''} 🎉`, 'success');
            } else if (lastLog === yesterday) {
                habit.streak += 1;
                habit.timeSpentToday = minutes;
                const pointsEarned = Math.floor(minutes / 15);
                habit.totalPoints += pointsEarned;
                habit.lastLoggedDate = today;
                showToast(`Logged! Streak: ${habit.streak} days 🔥`, 'success');
            } else if (!lastLog) {
                habit.streak = 1;
                habit.timeSpentToday = minutes;
                const pointsEarned = Math.floor(minutes / 15);
                habit.totalPoints += pointsEarned;
                habit.lastLoggedDate = today;
                showToast(`Logged ${minutes} mins = ${pointsEarned} point${pointsEarned !== 1 ? 's' : ''} 🎉`, 'success');
            } else {
                habit.streak = 1;
                habit.timeSpentToday = minutes;
                habit.totalPoints = Math.floor(minutes / 15);
                habit.lastLoggedDate = today;
                showToast('Logged! 🎉', 'success');
            }
            await saveHabits();
            renderHabits();
        }

        async function deleteHabit(habitId) {
            if (!confirm('Delete this habit?')) return;
            const habit = habits.find(h => h.id === habitId);
            if (habit) habit.isDeleted = true;
            await saveHabits();
            renderHabits();
            showToast('Habit deleted', 'success');
        }

        function showAuth() {
            document.getElementById('authScreen').style.display = 'flex';
            document.getElementById('appScreen').style.display = 'none';
        }

        function showApp() {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('appScreen').style.display = 'block';
            renderHabits();
        }

        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
            setTimeout(() => { errorEl.style.display = 'none'; }, 5000);
        }

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 3000);
        }

        function showLogin() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';
        }

        function showRegister() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
        }

        document.addEventListener('DOMContentLoaded', async function() {
            try {
                const sb = initSupabase();
                if (sb) {
                    const { data: { user } } = await sb.auth.getUser();
                    if (user) {
                        currentUser = user;
                        document.getElementById('userName').textContent = user.email?.split('@')[0] || 'User';
                        document.getElementById('userEmail').textContent = user.email || '';
                        document.getElementById('userAvatar').textContent = (user.email || 'U')[0].toUpperCase();
                        await loadHabits();
                        showApp();
                        renderHabits();
                        return;
                    }
                }
            } catch (err) {
                console.error('Init error:', err);
            }
            showAuth();
        });
    </script>
</body>
</html>
